<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pocket Encore</title>
<link rel="icon" href="/rbu.ico">
<script>
// theme before the first paint (no flash): the saved choice, or Auto = Windows' light/dark setting
(function () { var p; try { p = localStorage.peTheme; } catch (e) {} p = p || "auto";
  document.documentElement.dataset.theme = p === "auto" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : p; })();
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="top">
  <a href="#/" class="brand">Pocket Encore</a><span id="version" class="version"></span><button id="updBadge" class="update hidden"></button>
  <nav class="topnav" aria-label="Main">
    <a href="#/" data-nav="songs">Songs</a>
    <a href="#/stick" data-nav="stick">Memory stick</a>
    <a href="#/packs" data-nav="share">Share</a>
    <a href="#/setup" id="setupLink" data-nav="setup">Settings</a>
  </nav>
  <span id="crumb"></span>
  <span class="grow"></span>
  <button id="buildToggle" class="hidden" title="Show the output of the last build">Build log</button>
  <a href="#/help" id="helpLink" class="navlink help" data-nav="help" title="How Pocket Encore works">Help</a>
</header>
<div id="offline" class="hidden"></div>
<main id="main"></main>
<section id="buildPanel" class="hidden">
  <div class="bar"><b id="buildTitle">Build</b><span id="buildState"></span><span class="grow"></span><button id="buildClose">Hide</button></div>
  <pre id="buildLog"></pre>
</section>
<div id="modal" class="hidden"><div class="box" id="modalBox"></div></div>
<script src="/app.js"></script>
<script src="/timeline.js"></script>
<script src="/editor.js"></script>
<script src="/anims.js"></script>
</body>
</html>
