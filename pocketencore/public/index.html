<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pocket Encore</title>
<link rel="icon" href="/rbu.ico">
<script>
// theme before the first paint (no flash): the saved choice, or Auto = Windows' light/dark setting
(function () { var p; try { p = localStorage.peTheme; } catch (e) {} p = p || "auto";
  document.documentElement.dataset.theme = p === "auto" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : p; })();
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="top">
  <a href="#/" class="brand">Pocket Encore</a><span id="version" class="version"></span>
  <a href="#/help" id="helpLink" class="navlink help" title="How Pocket Encore works">Help</a>
  <span class="tag">custom songs for the handheld Rock Band</span>
  <span id="crumb"></span>
  <span class="grow"></span>
  <a href="#/packs" class="navlink" title="Song packs to switch on the memory stick">Packs</a>
  <span id="modeBadge" class="badge"></span>
  <a href="#/setup" id="setupLink" class="navlink" title="Paths to Python, at3tool, mid2rbu and the game folder">Setup</a>
  <button id="buildToggle" title="Show the build output">Build log</button>
  <select id="themeSel" title="Theme: Auto follows Windows' light or dark setting"><option value="auto">◐ Auto</option><option value="light">☀ Light</option><option value="dark">☾ Dark</option></select>
</header>
<main id="main"></main>
<section id="buildPanel" class="hidden">
  <div class="bar"><b id="buildTitle">Build</b><span id="buildState"></span><span class="grow"></span><button id="buildClose">Hide</button></div>
  <pre id="buildLog"></pre>
</section>
<div id="modal" class="hidden"><div class="box" id="modalBox"></div></div>
<script src="/app.js"></script>
<script src="/editor.js"></script>
</body>
</html>
